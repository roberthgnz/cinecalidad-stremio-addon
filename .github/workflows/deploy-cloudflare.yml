name: Deploy to Cloudflare Workers

on:
  push:
    branches: [ main ]
    paths-ignore: [ 'docs/**', '**.md' ]
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22.x'

    - name: Install pnpm
      run: npm install -g pnpm@9

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Run tests
      run: pnpm test

    - name: Check Cloudflare credentials
      id: creds
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      run: |
        if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
          echo "ok=true" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; skipping deploy"
        fi

    # Requires repo secrets CLOUDFLARE_API_TOKEN (Workers Scripts:Edit, D1:Edit)
    # and CLOUDFLARE_ACCOUNT_ID
    - name: Apply D1 migrations and deploy
      if: steps.creds.outputs.ok == 'true'
      uses: cloudflare/wrangler-action@v4
      with:
        apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        packageManager: pnpm
        command: |
          d1 migrations apply DB --remote
          deploy
